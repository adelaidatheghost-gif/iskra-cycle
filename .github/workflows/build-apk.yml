name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Launch-test APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.adelaida.ritm/.MainActivity
            sleep 4
            adb shell pidof com.adelaida.ritm
            adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|AndroidRuntime|com.adelaida.ritm" > launch-log.txt || true
            if grep -q "FATAL EXCEPTION" launch-log.txt; then
              cat launch-log.txt
              exit 1
            fi

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ritm-0.1.1.apk

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 Ritm-0.1.1.apk --clobber
          else
            gh release create v0.1.1 Ritm-0.1.1.apk               --title "Ритм 0.1.1"               --notes "Исправленная Android-версия, проверенная запуском в эмуляторе."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ritm-0.1.1-apk
          path: Ritm-0.1.1.apk
          if-no-files-found: error
