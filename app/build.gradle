plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adelaida.ritm'
    compileSdk 36

    signingConfigs {
        debug {
            storeFile rootProject.file('ritm-dev.keystore')
            storePassword 'ritmdev123'
            keyAlias 'ritmdev'
            keyPassword 'ritmdev123'
        }
    }

    defaultConfig {
        applicationId 'com.adelaida.ritm'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
